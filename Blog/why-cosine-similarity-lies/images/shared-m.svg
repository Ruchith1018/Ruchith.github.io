<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680">
  <defs><marker id="aInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="aBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="aRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="aMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="aYel" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b98a00"/></marker></defs>
  <rect width="420" height="680" fill="#ffffff"/>
  <line x1="44.0" y1="250.0" x2="324.8" y2="250.0" stroke="#e1e0d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
  <line x1="44.0" y1="250.0" x2="44.0" y2="104.2" stroke="#e1e0d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
  <line x1="44.0" y1="250.0" x2="-43.0" y2="300.2" stroke="#e1e0d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
  <line x1="44.0" y1="250.0" x2="260.0" y2="250.0" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round" marker-end="url(#aInk)"/>
  <line x1="260.0" y1="250.0" x2="260.0" y2="142.0" stroke="#b98a00" stroke-width="3" stroke-linecap="round" marker-end="url(#aYel)"/>
  <line x1="260.0" y1="250.0" x2="202.0" y2="283.5" stroke="#b98a00" stroke-width="3" stroke-linecap="round" marker-end="url(#aYel)"/>
  <line x1="44.0" y1="250.0" x2="260.0" y2="142.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <line x1="44.0" y1="250.0" x2="202.0" y2="283.5" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <path d="M260.0,232.7 L250.7,238.1 L250.7,255.4" fill="none" stroke="#b98a00" stroke-width="1.5"/>
  <text x="272.0" y="255.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start">c = shared part</text>
  <text x="270.0" y="138.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="14" fill="#8a6400" font-weight="700" text-anchor="start">s_A</text>
  <text x="190.0" y="301.5" font-family="Space Mono, Consolas, Menlo, monospace" font-size="14" fill="#8a6400" font-weight="700" text-anchor="end">s_B</text>
  <text x="157.4" y="183.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="end">A = c + s_A</text>
  <text x="142.6" y="305.5" font-family="Space Mono, Consolas, Menlo, monospace" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="end">B = c + s_B</text>
  <circle cx="44" cy="250" r="4" fill="#52514e"/>
  <text x="34.0" y="352.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Two unrelated texts</text>
  <text x="34.0" y="378.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">Their own meanings s_A and s_B point in</text>
  <text x="34.0" y="398.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">unrelated (perpendicular) directions.</text>
  <text x="34.0" y="418.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">Both also carry the shared component c.</text>
  <rect x="34" y="438" width="352" height="78" rx="10" fill="#fcfcfb" stroke="#d9d8d0"/>
  <text x="50.0" y="483.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">cos(A, B) =</text>
  <text x="272.0" y="466.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">‖c‖² + s_A·s_B</text>
  <line x1="174.0" y1="477.0" x2="370.0" y2="477.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="272.0" y="499.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">‖c‖² + ‖s‖²</text>
  <text x="34.0" y="548.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">With ‖c‖ = 2, ‖s‖ = 1 and s_A ⟂ s_B ⟂ c:</text>
  <text x="34.0" y="578.0" font-family="Space Mono, Consolas, Menlo, monospace" font-size="19" fill="#e34948" font-weight="700" text-anchor="start">cos = 4 / (4 + 1) = 0.80</text>
  <text x="34.0" y="604.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">The score measures c, not meaning.</text>
</svg>
