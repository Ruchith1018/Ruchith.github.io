<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- left: read-heavy -->
  <rect x="24" y="20" width="408" height="360" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="228" y="54" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">Read-heavy work: delegate</text>
  <text x="228" y="78" text-anchor="middle" font-size="13" fill="#166534">Independent questions, answers combine cleanly</text>
  <rect x="148" y="98" width="160" height="44" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="228" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Main agent</text>
  <g font-size="12.5" fill="#14532d" text-anchor="middle">
    <rect x="44" y="196" width="112" height="58" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="100" y="220">Pricing of</text><text x="100" y="238">vendor X</text>
    <rect x="172" y="196" width="112" height="58" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="228" y="220">Pricing of</text><text x="228" y="238">vendor Y</text>
    <rect x="300" y="196" width="112" height="58" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="356" y="220">Pricing of</text><text x="356" y="238">vendor Z</text>
  </g>
  <path d="M190 142 L110 194" stroke="#16a34a" stroke-width="2"/>
  <path d="M228 142 L228 194" stroke="#16a34a" stroke-width="2"/>
  <path d="M266 142 L346 194" stroke="#16a34a" stroke-width="2"/>
  <text x="228" y="296" text-anchor="middle" font-size="14" fill="#166534">Each subagent can finish without knowing</text>
  <text x="228" y="316" text-anchor="middle" font-size="14" fill="#166534">what the others decided.</text>
  <text x="228" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">✓ Parallel and safe</text>

  <!-- right: write-heavy -->
  <rect x="468" y="20" width="408" height="360" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="672" y="54" text-anchor="middle" font-size="19" font-weight="700" fill="#7f1d1d">Write-heavy work: keep together</text>
  <text x="672" y="78" text-anchor="middle" font-size="13" fill="#991b1b">Parts must agree on choices nobody wrote down</text>
  <rect x="592" y="98" width="160" height="44" rx="10" fill="#ffffff" stroke="#dc2626"/>
  <text x="672" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Main agent</text>
  <g font-size="12.5" fill="#7f1d1d" text-anchor="middle">
    <rect x="500" y="196" width="150" height="58" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="575" y="220">Game background</text><text x="575" y="238">(chose a retro style)</text>
    <rect x="694" y="196" width="150" height="58" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="769" y="220">Player character</text><text x="769" y="238">(chose a realistic style)</text>
  </g>
  <path d="M640 142 L580 194" stroke="#dc2626" stroke-width="2"/>
  <path d="M704 142 L764 194" stroke="#dc2626" stroke-width="2"/>
  <path d="M652 225 L692 225" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="672" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">≠</text>
  <text x="672" y="296" text-anchor="middle" font-size="14" fill="#991b1b">Each part made hidden decisions; the pieces</text>
  <text x="672" y="316" text-anchor="middle" font-size="14" fill="#991b1b">no longer fit together.</text>
  <text x="672" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">✗ Conflicting outputs</text>
</svg>
