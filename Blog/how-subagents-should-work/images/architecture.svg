<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- main agent -->
  <rect x="250" y="24" width="400" height="128" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="450" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b4b">Main agent (orchestrator)</text>
  <text x="450" y="82" text-anchor="middle" font-size="14" fill="#3730a3">Owns the goal, the plan, shared decisions and the final answer</text>
  <rect x="290" y="98" width="320" height="38" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="450" y="122" text-anchor="middle" font-size="13" fill="#3730a3">Context: user request, plan, short results only</text>

  <!-- subagents -->
  <g>
    <rect x="40" y="250" width="240" height="140" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="160" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Subagent A</text>
    <text x="160" y="300" text-anchor="middle" font-size="13" fill="#475569">Own context window</text>
    <text x="160" y="318" text-anchor="middle" font-size="13" fill="#475569">Own prompt and tools</text>
    <rect x="62" y="332" width="196" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="352" text-anchor="middle" font-size="12" fill="#64748b">searches, pages, logs,</text>
    <text x="160" y="368" text-anchor="middle" font-size="12" fill="#64748b">dead ends (stay here)</text>
  </g>
  <g>
    <rect x="330" y="250" width="240" height="140" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="450" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Subagent B</text>
    <text x="450" y="300" text-anchor="middle" font-size="13" fill="#475569">Own context window</text>
    <text x="450" y="318" text-anchor="middle" font-size="13" fill="#475569">Own prompt and tools</text>
    <rect x="352" y="332" width="196" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="450" y="352" text-anchor="middle" font-size="12" fill="#64748b">searches, pages, logs,</text>
    <text x="450" y="368" text-anchor="middle" font-size="12" fill="#64748b">dead ends (stay here)</text>
  </g>
  <g>
    <rect x="620" y="250" width="240" height="140" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="740" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Subagent C</text>
    <text x="740" y="300" text-anchor="middle" font-size="13" fill="#475569">Own context window</text>
    <text x="740" y="318" text-anchor="middle" font-size="13" fill="#475569">Own prompt and tools</text>
    <rect x="642" y="332" width="196" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="740" y="352" text-anchor="middle" font-size="12" fill="#64748b">searches, pages, logs,</text>
    <text x="740" y="368" text-anchor="middle" font-size="12" fill="#64748b">dead ends (stay here)</text>
  </g>

  <!-- briefs (down) -->
  <path d="M330 152 C 250 190, 180 205, 160 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#down)"/>
  <path d="M435 152 L 435 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#down)"/>
  <path d="M570 152 C 650 190, 720 205, 740 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#down)"/>
  <!-- results (up) -->
  <path d="M195 246 C 230 205, 300 185, 360 156" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#up)"/>
  <path d="M465 246 L 465 156" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#up)"/>
  <path d="M705 246 C 670 205, 600 185, 540 156" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#up)"/>

  <!-- legend chips -->
  <rect x="96" y="176" width="150" height="28" rx="14" fill="#dbeafe"/>
  <text x="171" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Brief goes down</text>
  <rect x="654" y="176" width="160" height="28" rx="14" fill="#dcfce7"/>
  <text x="734" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Result comes up</text>

  <!-- shared workspace -->
  <rect x="40" y="430" width="820" height="66" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Shared workspace (files, database, memory)</text>
  <text x="450" y="481" text-anchor="middle" font-size="13" fill="#b45309">Large outputs are written here; only a short summary and a reference go back up</text>
  <path d="M160 390 L160 428" stroke="#d97706" stroke-width="2"/>
  <path d="M450 390 L450 428" stroke="#d97706" stroke-width="2"/>
  <path d="M740 390 L740 428" stroke="#d97706" stroke-width="2"/>
</svg>
